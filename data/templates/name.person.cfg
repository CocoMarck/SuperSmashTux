; Copiar a `data/power_fighters/<id>.person.cfg`
; Siempre usa el prefab `standard_power_fighter.tscn`.

[identity]
id = "template"
model = "" ; Ruta del `res://assets//personaje.glb`. Remplaza malla del `prefab`
position_offset = Vector3(0,0,0)

[momentum]
ground_acceleration = -1.0
ground_friction = -1.0
air_acceleration = -1.0
knockback_friction = -1.0

[horizontal_movement]
walking_speed = 3
running_speed = 8

[vertical_movement]
jump_impulse = 10

[interval]
walk_step_interval = 0.35
run_step_interval = 0.25
crouch_move_step_interval = 0.32

[duration_of_anims]
air_jump_duration = -1.0