; Personaje base. Usa el mismo modelo que el prefab `standard_power_fighter.tscn`,
; asi que el configurer no reemplaza la malla. Valores = defaults de `Person`.

[identity]
id = "standard"
model = "res://assets/models/standard/standard_character_a_pose.glb" ; Mismo glb del prefab: no se reemplaza la malla.
position_offset = Vector3(0.0,0.0,0.0)

[momentum]
ground_acceleration = 40.0
ground_friction = 100.0
air_acceleration = 40.0
knockback_friction = 20.0

[horizontal_movement]
walking_speed = 3
running_speed = 8

[vertical_movement]
jump_impulse = 10

[interval]
walk_step_interval = 0.35
run_step_interval = 0.32
crouch_move_step_interval = 0.4

[duration_of_anims]
air_jump_duration = 0.5833
